[project]
name = "courier-declustering"
version = "0.1.0"
description = "Curitiba food-delivery simulator and benchmark of dispatch models from identical clustered starts"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.5",
    "pandas>=3.1",
    "pyarrow>=26.0",
    "scipy>=1.18",
    "geopandas>=1.2",
    "pyogrio>=0.13",
    "pyproj>=3.8",
    "shapely>=2.2",
    "h3>=4.5,<5",
    "osmnx>=2.1,<3",
    "networkx>=3.7",
    "pot>=0.9.7",
    "matplotlib>=3.11",
    "scikit-learn>=1.9",
    "torch==2.6.0",
]

[dependency-groups]
dev = ["pytest>=9.2"]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
